    const VERIFIED_RESOURCES = [

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentRoute, setCurrentRoute] = useState('landing'); 
      const [warningAccepted, setWarningAccepted] = useState(false);
      const [selectedCharacter, setSelectedCharacter] = useState(CHARACTERS[0]);
      
      const [currentBeatIdx, setCurrentBeatIdx] = useState(0);

      const [pressure, setPressure] = useState({ family: 10, work: 0, church: 0, police: 5, school: 10, friends: 10, online: 0 });
      const [doorsLog, setDoorsLog] = useState([]);
      const [completedCharacters, setCompletedCharacters] = useState([]);
      
      const [muted, setMuted] = useState(true);
      const [reduceBlameComments, setReduceBlameComments] = useState(false);
      const [supportModalOpen, setSupportModalOpen] = useState(false);

      const chatBottomRef = useRef(null);

      useEffect(() => {
        const saved = localStorage.getItem('femicide_awareness_state');
        if (saved) {
          try {
            const parsed = JSON.parse(saved);
            if (parsed.warningAccepted) setWarningAccepted(true);
            if (parsed.completedCharacters) setCompletedCharacters(parsed.completedCharacters);
          } catch (e) {
            console.error('Error loading saved state:', e);
          }
        }
      }, []);

      const saveProgress = (newCompleted) => {
        localStorage.setItem('femicide_awareness_state', JSON.stringify({
          warningAccepted: true,
          completedCharacters: newCompleted
        }));
      };

      const handleAcceptWarning = () => {
        setWarningAccepted(true);
        setCurrentRoute('choose');
        saveProgress(completedCharacters);
      };

      const startCharacterStory = (char) => {
        setSelectedCharacter(char);
        setCurrentBeatIdx(0);
        setCurrentNodeIdx(0);
        setPressure(char.initialPressure);
        setDoorsLog([]);
        setCurrentRoute('play');
      };

      const calculateTotalPressure = () => {
        return Object.values(pressure).reduce((acc, curr) => acc + curr, 0);
      };

      const addPressure = (pressureMap) => {
        if (!pressureMap) return;
        setPressure(prev => {
          const next = { ...prev };
          Object.keys(pressureMap).forEach(key => {
            next[key] = (next[key] || 0) + pressureMap[key];
          });
          return next;
        });
      };

      const handleDoorClick = (door) => {
        if (doorsLog.some(d => d.id === door.id)) return;
        setDoorsLog(prev => [...prev, door]);
        addPressure({ [door.pressure]: 15 });
      };

      const markCharacterComplete = () => {
        if (!completedCharacters.includes(selectedCharacter.id)) {
          const updated = [...completedCharacters, selectedCharacter.id];
          setCompletedCharacters(updated);
          saveProgress(updated);
        }
      };

      const activeScenes = SCENES_DATA[selectedCharacter.id] || SCENES_DATA['chioma'];
      const currentScene = activeScenes[currentBeatIdx] || activeScenes[0];

      const handleNextNode = () => {
        if (currentNodeIdx < currentScene.nodes.length - 1) {
          setCurrentNodeIdx(prev => prev + 1);
        } else {
          if (currentBeatIdx < activeScenes.length - 1) {
            setCurrentBeatIdx(prev => prev + 1);
            setCurrentNodeIdx(0);
          } else {
            markCharacterComplete();
            setCurrentRoute('finale');
          }
        }
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans select-none overflow-x-hidden antialiased">
          {/* Safety Bar */}
          {currentRoute !== 'landing' && (
            <header className="sticky top-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between text-xs sm:text-sm">
              <div className="flex items-center space-x-2">
                <button 
                  onClick={() => setCurrentRoute('choose')}
                  className="flex items-center space-x-1 text-slate-400 hover:text-amber-400 transition-colors font-medium"
                >
                  <ArrowLeft className="w-4 h-4" />
                  <span>Exit / Pause</span>
                </button>
                <span className="text-slate-700">|</span>
                <span className="text-slate-400 truncate max-w-[120px] sm:max-w-none">
                  Playing as <strong className="text-amber-400 font-semibold">{selectedCharacter.name}</strong>
                </span>
              </div>

              <div className="flex items-center space-x-2 sm:space-x-3">
                <button 
                  onClick={() => setMuted(!muted)}
                  className="p-1.5 rounded-full bg-slate-800 text-slate-300 hover:bg-slate-700 transition"
                >
                  {muted ? <VolumeX className="w-4 h-4" /> : <Volume2 className="w-4 h-4 text-emerald-400" />}
                </button>

                <button
                  onClick={() => setSupportModalOpen(true)}
                  className="px-3 py-1.5 rounded-full bg-rose-600/20 border border-rose-500/40 text-rose-300 hover:bg-rose-600 hover:text-white font-medium transition-all flex items-center space-x-1.5 shadow-sm"
                >
                  <Shield className="w-3.5 h-3.5" />
                  <span>Get Support</span>
                </button>
              </div>
            </header>
          )}

          {/* Main Stage */}

            {/* Landing Warning Gate */}
            {currentRoute === 'landing' && (
              <div className="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-md text-center space-y-6 my-auto">
                <div className="inline-flex p-3 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-500 mb-2">
                  <AlertTriangle className="w-10 h-10 animate-pulse" />
                </div>

                <div className="space-y-2">
                  <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight bg-gradient-to-r from-rose-400 via-amber-300 to-amber-500 bg-clip-text text-transparent">
                    Femicide Awareness Interactive
                  </h1>
                  <p className="text-xs uppercase tracking-widest text-slate-400 font-semibold">
                    The story of all the women and girls we lost
                  </p>
                </div>

                <div className="bg-slate-950/80 border border-slate-800/80 rounded-2xl p-4 text-left space-y-3 text-xs sm:text-sm text-slate-300 leading-relaxed">
                  <div className="flex items-center space-x-2 text-rose-400 font-semibold">
                    <ShieldAlert className="w-4 h-4" />
                    <span>Sensitive Content Warning</span>
                  </div>
                  <p>
                    This web experience depicts the final months of four Nigerian women based on real patterns of gender-based violence, stalking, domestic abuse, and systemic non-response.

                  className="w-full py-4 rounded-2xl bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-bold text-sm tracking-wide shadow-lg shadow-rose-950/50 transition-all transform active:scale-95 flex items-center justify-center space-x-2"
                >
                  <span>I Understand & Wish to Proceed</span>
                  <ChevronRight className="w-4 h-4" />
                </button>

                <div className="text-[11px] text-slate-400 flex items-center justify-center space-x-4">
                  <span>Mobile-First Experience</span>
                  <span>•</span>
                  <span>Anonymous & Private</span>
                </div>
              </div>
            )}

            {/* Character Selection */}
            {currentRoute === 'choose' && (
              <div className="w-full space-y-6 py-4">
                <div className="text-center space-y-2">
                  <h2 className="text-2xl sm:text-3xl font-bold tracking-tight text-slate-100">

                  <p className="text-xs sm:text-sm text-slate-400 max-w-md mx-auto">

                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  {CHARACTERS.map(char => {
                    const isDone = completedCharacters.includes(char.id);
                    return (
                      <div

                        className={`group relative rounded-2xl border p-5 cursor-pointer transition-all duration-300 hover:scale-[1.02] flex flex-col justify-between ${char.avatarBg} ${isDone ? 'border-emerald-500/50 bg-emerald-950/20' : 'border-slate-800 hover:border-amber-500/50'}`}

                {/* Pressure HUD */}

                      {calculateTotalPressure()} pt

                  {/* Top Status */}
                  <div className="w-full px-4 pt-1 pb-2 flex items-center justify-between text-[11px] font-mono text-slate-400 border-b border-slate-800/60 mb-2">
                    <span>09:41</span>
                    <div className="w-16 h-3 bg-slate-900 rounded-full mx-auto border border-slate-800"></div>
                    <div className="flex items-center space-x-1.5">
                      <span>5G</span>
                      <div className="w-4 h-2 bg-slate-400 rounded-sm"></div>

                  <div className="bg-slate-900/80 rounded-xl p-2.5 mb-3 flex items-center justify-between border border-slate-800">
                    <div className="flex items-center space-x-2">
                      <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${selectedCharacter.avatarColor} flex items-center justify-center text-white font-bold text-xs`}>

                  {/* Dynamic Interfaces */}

                    {/* Chat Simulation */}

                        {currentScene.nodes.slice(0, currentNodeIdx + 1).map((node, idx) => {
                          if (node.type === 'narration') {
                            return (
                              <div key={idx} className="bg-slate-900/60 border border-slate-800/80 rounded-xl p-3 text-center my-2">
                                <p className="text-xs text-slate-300 italic leading-relaxed">{node.text}</p>
                              </div>
                            );
                          }
                          if (node.type === 'message') {
                            const isHer = node.from === 'her';
                            return (
                              <div key={idx} className={`flex flex-col ${isHer ? 'items-end' : 'items-start'} space-y-1`}>
                                {!isHer && <span className="text-[10px] text-slate-400 px-1 font-semibold">{node.from}</span>}
                                <div className={`max-w-[82%] rounded-2xl px-3.5 py-2.5 text-xs shadow-md ${
                                  isHer 
                                    ? 'bg-emerald-900/70 border border-emerald-700/40 text-emerald-100 rounded-br-none' 
                                    : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-bl-none'
                                }`}>
                                  <p className="leading-relaxed">{node.text}</p>
                                  <div className="flex items-center justify-end space-x-1 text-[9px] text-slate-400 mt-1">
                                    <span>09:42</span>
                                    {isHer && <CheckCheck className="w-3 h-3 text-emerald-400" />}
                                  </div>
                                </div>
                              </div>
                            );
                          }
                          if (node.type === 'choice') {
                            return (
                              <div key={idx} className="bg-slate-900/90 border border-amber-500/30 rounded-2xl p-3 my-3 space-y-2">
                                <span className="text-[10px] font-bold text-amber-400 tracking-wider uppercase block">
                                  Select Response
                                </span>
                                <div className="space-y-2">
                                  {node.options.map((opt, oIdx) => {
                                    const isGreyedOut = opt.disabledAbove && calculateTotalPressure() >= opt.disabledAbove;
                                    return (
                                      <button
                                        key={oIdx}
                                        disabled={isGreyedOut}
                                        onClick={() => {
                                          addPressure(opt.pressure);
                                          handleNextNode();
                                        }}
                                        className={`w-full text-left p-2.5 rounded-xl text-xs transition-all ${
                                          isGreyedOut 
                                            ? 'bg-slate-950 text-slate-600 border border-slate-900 cursor-not-allowed line-through' 
                                            : 'bg-amber-500/10 border border-amber-500/30 text-amber-200 hover:bg-amber-500/20 active:scale-98'
                                        }`}
                                      >
                                        {opt.label}
                                        {isGreyedOut && <span className="block text-[9px] text-rose-500 font-semibold no-underline">Choice blocked due to high pressure</span>}
                                      </button>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          }
                          return null;
                        })}
                      </div>
                    )}

                    {/* Doors Map */}
                    {currentScene.interface === 'doors' && (
                      <div className="space-y-3">

                          <p>Select doors to reach out to. Observe how support networks consistently shift responsibility back onto the woman.</p>
                        </div>

                        <div className="grid grid-cols-1 gap-2.5">
                          {currentScene.nodes.filter(n => n.type === 'door').map((door) => {
                            const isLogged = doorsLog.some(d => d.id === door.id);
                            return (
                              <div
                                key={door.id}
                                onClick={() => handleDoorClick(door)}
                                className={`p-3 rounded-xl border transition-all cursor-pointer ${
                                  isLogged 
                                    ? 'bg-slate-900/40 border-rose-900/40 opacity-75' 
                                    : 'bg-slate-900 border-slate-800 hover:border-amber-500/50'
                                }`}
                              >
                                <div className="flex items-center justify-between mb-1">
                                  <span className="text-xs font-bold text-slate-200">{door.label}</span>
                                  <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded ${
                                    isLogged ? 'bg-rose-950 text-rose-400 border border-rose-800/50' : 'bg-slate-800 text-slate-400'
                                  }`}>
                                    {isLogged ? door.response : 'Unopened'}
                                  </span>
                                </div>
                                {isLogged && (
                                  <p className="text-xs text-rose-200/90 italic mt-2 border-t border-slate-800 pt-2">
                                    "{door.text}"

                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {/* Police Station & Cut-away */}
                    {currentScene.interface === 'police' && (
                      <div className="space-y-3">

                          >
                            {reduceBlameComments ? <EyeOff className="w-3.5 h-3.5" /> : <Eye className="w-3.5 h-3.5" />}
                            <span>{reduceBlameComments ? 'Show All Comments' : 'Filter Victim Blaming'}</span>
                          </button>
                        </div>

                        {currentScene.nodes.map((node, idx) => {
                          if (node.type === 'post') {
                            return (
                              <div key={idx} className="bg-slate-900 border border-slate-800 rounded-xl p-3.5 space-y-2">
                                <div className="flex items-center space-x-2">
                                  <div className="w-7 h-7 rounded-full bg-rose-600 flex items-center justify-center text-white font-bold text-xs">
                                    N
                                  </div>
                                  <div>
                                    <h5 className="text-xs font-bold text-slate-100">{node.author}</h5>
                                    <span className="text-[9px] text-slate-400">Verified Channel • 1h ago</span>
                                  </div>
                                </div>
                                <p className="text-xs text-slate-200 leading-relaxed">{node.text}</p>
                                <div className="flex items-center space-x-4 text-[11px] text-slate-400 pt-1 border-t border-slate-800/60">
                                  <span className="flex items-center space-x-1">
                                    <Heart className="w-3.5 h-3.5 text-rose-500" />
                                    <span>{node.likes.toLocaleString()}</span>
                                  </span>
                                  <span className="flex items-center space-x-1">
                                    <MessageSquare className="w-3.5 h-3.5" />
                                    <span>Comments</span>
                                  </span>
                                </div>
                              </div>
                            );
                          }

                          if (node.type === 'comment') {
                            if (reduceBlameComments && node.stance === 'blame') return null;
                            return (
                              <div key={idx} className={`p-2.5 rounded-lg border text-xs space-y-1 ${
                                node.stance === 'blame' 
                                  ? 'bg-rose-950/20 border-rose-900/30 text-rose-200/80' 
                                  : node.stance === 'counter'
                                  ? 'bg-amber-950/20 border-amber-900/30 text-amber-200'
                                  : 'bg-slate-900 border-slate-800 text-slate-300'
                              }`}>
                                <div className="flex items-center justify-between text-[10px]">
                                  <span className="font-bold text-slate-400">Anonymous User</span>
                                  <span className={`px-1.5 py-0.5 rounded text-[9px] font-semibold ${
                                    node.stance === 'blame' ? 'bg-rose-900/40 text-rose-400' : 'bg-slate-800 text-slate-400'
                                  }`}>
                                    {node.stance}
                                  </span>
                                </div>
                                <p className="leading-snug">{node.text}</p>
                              </div>
                            );
                          }
                          return null;
                        })}
                      </div>
                    )}

                    <div ref={chatBottomRef} />
                  </div>

                  {/* Proceed Action Button */}
                  <div className="pt-3 border-t border-slate-800/80 mt-2">
                    <button
                      onClick={handleNextNode}
                      className="w-full py-3 rounded-xl bg-gradient-to-r from-amber-500 to-rose-600 hover:from-amber-400 hover:to-rose-500 text-white text-xs font-bold tracking-wide shadow-md transition-all flex items-center justify-center space-x-1.5"
                    >
                      <span>
                        {currentNodeIdx < currentScene.nodes.length - 1 
                          ? 'Continue Reading' 
                          : currentBeatIdx < activeScenes.length - 1 
                          ? 'Proceed to Next Beat' 
                          : 'View Story Finale'}
                      </span>
                      <ChevronRight className="w-4 h-4" />
                    </button>
                  </div>

                </div>
              </div>
            )}

            {/* Story Finale */}
            {currentRoute === 'finale' && (
              <div className="w-full max-w-lg bg-slate-900/90 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-md text-center space-y-6 my-auto">
                <div className="inline-flex p-3 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-400">
                  <Scale className="w-10 h-10" />
                </div>

                <div className="space-y-3">
                  <h2 className="text-2xl font-bold text-white">
                    {selectedCharacter.name} is not the only one.
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-md mx-auto">
                    She was killed not because of a private mistake, but because systemic doors closed on her at every turn. Gender-based violence in Nigeria is fueled by systemic silence and institutional non-response.
                  </p>
                </div>

                <div className="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-left space-y-2 text-xs">
                  <span className="text-amber-400 font-bold uppercase tracking-wider block text-[10px]">
                    Systemic Audit for {selectedCharacter.name}
                  </span>
                  <div className="flex justify-between text-slate-300">
                    <span>Total Accumulated Pressure:</span>
                    <strong className="text-rose-400 font-mono">{calculateTotalPressure()} points</strong>
                  </div>
                  <div className="flex justify-between text-slate-300">
                    <span>Support Doors Attempted:</span>
                    <strong className="text-amber-400">{doorsLog.length} doors</strong>
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  <button
                    onClick={() => setCurrentRoute('data-story')}
                    className="w-full py-3.5 rounded-xl bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 text-white font-bold text-xs sm:text-sm tracking-wide shadow-lg transition-all flex items-center justify-center space-x-2"
                  >
                    <BookOpen className="w-4 h-4" />
                    <span>Explore the Femicide Data Story</span>
                  </button>

                  <button
                    onClick={() => setCurrentRoute('choose')}
                    className="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs transition-all flex items-center justify-center space-x-2"
                  >
                    <RotateCcw className="w-4 h-4" />
                    <span>Play as Another Character</span>
                  </button>
                </div>
              </div>
            )}

            {/* Data Story */}
            {currentRoute === 'data-story' && (
              <div className="w-full space-y-8 py-6">
                <div className="text-center space-y-3 border-b border-slate-800 pb-6">
                  <span className="text-xs font-mono text-rose-500 tracking-widest uppercase font-bold">
                    National Data Breakdown
                  </span>
                  <h2 className="text-3xl font-extrabold text-white">
                    Femicide in Nigeria: Beyond the Numbers
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-400 max-w-xl mx-auto">
                    A data-driven view examining systemic breakdowns, law vs. practice, and verified national response channels.
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center space-y-1">
                    <span className="text-3xl font-extrabold text-rose-500 font-mono">72%+</span>
                    <p className="text-xs text-slate-300 font-semibold">Perpetrators Known to Victim</p>
                    <span className="text-[10px] text-slate-400 block pt-1">Intimate partners, family members, or acquaintances</span>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center space-y-1">
                    <span className="text-3xl font-extrabold text-amber-500 font-mono">35 / 36</span>
                    <p className="text-xs text-slate-300 font-semibold">States Adopted VAPP Act</p>
                    <span className="text-[10px] text-slate-400 block pt-1">Yet enforcement mechanisms remain vastly underfunded</span>
                  </div>
                  <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 text-center space-y-1">
                    <span className="text-3xl font-extrabold text-indigo-400 font-mono">&lt; 8%</span>
                    <p className="text-xs text-slate-300 font-semibold">Formal Police Prosecutions</p>
                    <span className="text-[10px] text-slate-400 block pt-1">Most cases settled informally or turned away</span>
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                  <h3 className="text-lg font-bold text-slate-100 flex items-center space-x-2">
                    <Shield className="w-5 h-5 text-amber-400" />
                    <span>The VAPP Act: Law vs. Reality</span>
                  </h3>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed">
                    The Violence Against Persons (Prohibition) Act of 2015 provides a comprehensive legal framework prohibiting domestic violence, stalking, and harassment. However, critical gaps persist:
                  </p>
                  <ul className="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs text-slate-400">
                    <li className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                      <strong className="text-rose-400 block mb-1">Lack of Specialized Desks</strong>
                      Most local police stations lack dedicated, trained gender officers.
                    </li>
                    <li className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                      <strong className="text-amber-400 block mb-1">Social Stigma & Out-of-Court Pressure</strong>
                      Family elders frequently pressure victims to settle violent threats internally.
                    </li>
                  </ul>
                </div>

                <div className="text-center space-y-4 pt-4 border-t border-slate-800">
                  <button
                    onClick={() => setSupportModalOpen(true)}
                    className="px-6 py-3.5 rounded-xl bg-gradient-to-r from-rose-600 to-amber-600 text-white font-bold text-xs sm:text-sm shadow-xl hover:opacity-95 transition"
                  >
                    Access Verified Emergency Support Directories
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* Support Modal */}
          {supportModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 max-h-[85vh] overflow-y-auto shadow-2xl relative">
                <button
                  onClick={() => setSupportModalOpen(false)}
                  className="absolute top-4 right-4 p-2 rounded-full bg-slate-800 text-slate-400 hover:text-white"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="space-y-1">
                  <div className="flex items-center space-x-2 text-rose-500 font-bold text-lg">
                    <Shield className="w-5 h-5" />
                    <span>Verified Support Resources (Nigeria)</span>
                  </div>
                  <p className="text-xs text-slate-400">
                    If you or someone you know is experiencing violence, stalking, or domestic abuse, reach out immediately to these verified services:
                  </p>
                </div>

                <div className="space-y-3">
                  {VERIFIED_RESOURCES.map((res, i) => (
                    <div key={i} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-2 text-xs">
                      <div className="flex items-center justify-between">
                        <h5 className="font-bold text-amber-400">{res.name}</h5>
                        <span className="text-[10px] text-slate-500 font-mono">{res.location}</span>
                      </div>
                      <p className="text-slate-300">{res.services}</p>
                      <div className="flex items-center justify-between pt-2 border-t border-slate-900 text-[11px]">
                        <a href={`tel:${res.phone}`} className="text-emerald-400 font-mono font-bold flex items-center space-x-1">
                          <PhoneCall className="w-3.5 h-3.5" />
                          <span>{res.phone}</span>
                        </a>
                        <span className="text-slate-400">{res.web}</span>
                      </div>
                    </div>
                  ))}
                </div>

                <div className="p-3 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-[11px] leading-relaxed">
                  <strong>Disclaimer:</strong> All names and story details in this interactive experience are fictionalized composite characters built from documented patterns. All statistics and organization details are sourced from verified public human rights records.
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="w-full border-t border-slate-900 py-4 text-center text-[11px] text-slate-400 space-y-1">
            <p>Femicide Awareness Interactive Storyboard • A dataphyte Project</p>
            <p className="text-slate-400">Designed with respect and strictly non-violent narrative principles.</p>
          </footer>
        </div>
      );
    }

    // Render React App using React 18 createRoot
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
