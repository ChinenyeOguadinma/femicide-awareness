          gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(ctx.currentTime);
          osc1.stop(ctx.currentTime + 0.12);

          const gain2 = ctx.createGain();

              <div className="flex flex-col items-center space-y-6 py-2">
                
                <div className="w-full max-w-md bg-slate-50 border border-dp-border rounded-xl p-3.5 flex items-center justify-between shadow-sm">
                  <div className="flex items-center space-x-3">
                    <button 
                      onClick={() => setSoundActive(!soundActive)}
                      className="p-2 rounded-lg bg-dp-lightBlue text-dp-blue hover:bg-dp-blue hover:text-white transition"
                      title="Toggle WhatsApp Audio Chime"
                    >
                      {soundActive ? <Volume2 className="w-4 h-4" /> : <VolumeX className="w-4 h-4" />}
                    </button>
                    <div>
                      <span className="text-xs font-bold text-dp-navy block">WhatsApp Chime: {soundActive ? 'ON' : 'OFF'}</span>
                      <span className="text-[10px] text-dp-mutedText italic">{currentScene.beatTitle}</span>
                    </div>
                  </div>

                  <div className="flex items-center space-x-3">
                    <div className="text-right">
                      <span className="text-[10px] font-bold text-dp-mutedText block uppercase tracking-wider">Pressure Index</span>
                      <span className="text-xs font-mono font-bold text-dp-navy">{calculateTotalPressure()} pt</span>
                    </div>
                    <div className="w-20 bg-slate-200 h-2 rounded-full overflow-hidden">
                      <div 
                        className="bg-dp-navy h-full transition-all duration-300" 
                        style={{ width: `${Math.min(100, (calculateTotalPressure() / 80) * 100)}%` }}
                      />
                    </div>
                  </div>
                </div>

                <div className="w-full max-w-sm bg-slate-900 rounded-[3rem] p-3 shadow-2xl border-4 border-slate-800 relative">
                  <div className="absolute top-3 left-1/2 transform -translate-x-1/2 w-32 h-5 bg-black rounded-full flex items-center justify-center space-x-2 z-20">
                    <div className="w-3 h-3 bg-slate-800 rounded-full"></div>
                    <div className="w-12 h-1 bg-slate-800 rounded-full"></div>
                  </div>

                  <div className="bg-[#EFEAE2] rounded-[2.5rem] overflow-hidden flex flex-col h-[600px] relative pt-7 border border-slate-700">
                    
                    <div className="bg-[#075E54] text-white px-4 py-3 flex items-center justify-between shadow-md z-10">
                      <div className="flex items-center space-x-2.5">
                        <div className="w-9 h-9 rounded-full bg-slate-300 flex items-center justify-center font-bold text-xs text-slate-800 font-heading">
                          {selectedCharacter.name[0]}
                        </div>
                        <div>
                          <h4 className="text-xs font-bold leading-tight">{currentScene.headerTitle || selectedCharacter.name}</h4>
                          <span className="text-[10px] text-emerald-200">online</span>
                        </div>
                      </div>
                      <span className="text-[10px] bg-emerald-800 text-emerald-100 px-2 py-0.5 rounded font-mono">
                        Beat {currentBeatIdx + 1}/6
                      </span>
                    </div>

                    <div ref={chatContainerRef} className="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar bg-[radial-gradient(#cbd5e1_1px,transparent_1px)] [background-size:16px_16px]">
                      
                      {currentScene.interface === 'phone' && (
                        <div className="space-y-3">
                          {currentScene.nodes.slice(0, currentNodeIdx + 1).map((node, idx) => {
                            if (node.type === 'narration') {
                              return (
                                <div key={idx} className="bg-white/90 backdrop-blur-sm border border-dp-border rounded-xl p-2.5 text-center my-2 shadow-xs">
                                  <p className="text-[11px] text-dp-mutedText italic leading-snug">{node.text}</p>
                                </div>
                              );
                            }
                            if (node.type === 'message') {
                              const isHer = node.from === 'her';
                              return (
                                <div key={idx} className={`flex flex-col ${isHer ? 'items-end' : 'items-start'} space-y-1`}>
                                  {!isHer && <span className="text-[10px] text-slate-500 px-1 font-medium">{node.from}</span>}
                                  <div className={`max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs shadow-xs ${
                                    isHer 
                                      ? 'bg-[#DCF8C6] text-slate-900 rounded-br-none' 
                                      : 'bg-white text-slate-900 rounded-bl-none'
                                  }`}>
                                    <p className="leading-relaxed">{node.text}</p>
                                    <div className="flex items-center justify-end space-x-1 text-[9px] text-slate-400 mt-1">
                                      <span>09:42 AM</span>
                                      {isHer && <CheckCheck className="w-3 h-3 text-blue-500" />}
                                    </div>
                                  </div>
                                </div>
                              );
                            }
                            if (node.type === 'choice') {
                              return (
                                <div key={idx} className="bg-white/95 border border-emerald-500/40 rounded-2xl p-3 my-3 space-y-2 shadow-md">
                                  <span className="text-[10px] font-bold text-emerald-800 tracking-wider uppercase block">
                                    WhatsApp Reply Options
                                  </span>
                                  <div className="space-y-1.5">
                                    {node.options.map((opt, oIdx) => {
                                      const isGreyedOut = opt.disabledAbove && calculateTotalPressure() >= opt.disabledAbove;
                                      return (
                                        <button
                                          key={oIdx}
                                          disabled={isGreyedOut}
                                          onClick={() => {
                                            addPressure(opt.pressure);
                                            handleNextNode();
                                          }}
                                          className={`w-full text-left p-2.5 rounded-xl text-xs font-medium transition-all ${
                                            isGreyedOut 
                                              ? 'bg-slate-100 text-slate-400 cursor-not-allowed line-through' 
                                              : 'bg-emerald-50 hover:bg-emerald-600 hover:text-white border border-emerald-200'
                                          }`}
                                        >
                                          {opt.label}
                                        </button>
                                      );
                                    })}
                                  </div>
                                </div>
                              );
                            }
                            return null;
                          })}
                        </div>
                      )}

                      {currentScene.interface === 'doors' && (
                        <div className="space-y-3">
                          <div className="bg-white p-3 rounded-xl border border-slate-200 text-xs text-slate-700 shadow-xs">
                            <p className="font-bold text-[#075E54] mb-1">Support Network Audit</p>
                            <p className="text-[11px]">Tap support entities below to test their response:</p>
                          </div>
                          {currentScene.nodes.filter(n => n.type === 'door').map((door) => {
                            const isLogged = doorsLog.some(d => d.id === door.id);
                            return (
                              <div
                                key={door.id}
                                onClick={() => handleDoorClick(door)}
                                className={`p-3 rounded-xl border transition-all cursor-pointer bg-white shadow-xs ${
                                  isLogged ? 'opacity-80 border-slate-300' : 'border-emerald-200 hover:border-emerald-500'
                                }`}
                              >
                                <div className="flex items-center justify-between mb-1">
                                  <span className="text-xs font-bold text-slate-900">{door.label}</span>
                                  <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">
                                    {isLogged ? door.response : 'Open'}
                                  </span>
                                </div>
                                {isLogged && (
                                  <p className="text-[11px] text-slate-600 italic mt-1 border-t border-slate-100 pt-1">
                                    "{door.text}"
                                  </p>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {currentScene.interface === 'police' && (
                        <div className="space-y-3">
                          {currentScene.nodes.slice(0, currentNodeIdx + 1).map((node, idx) => {
                            if (node.type === 'dialogue') {
                              return (
                                <div key={idx} className="bg-white p-3 rounded-xl border border-slate-200 text-xs shadow-xs">
                                  <span className="font-bold block text-[10px] text-[#075E54] uppercase mb-0.5">{node.speaker}</span>
                                  <p>"{node.text}"</p>
                                </div>
                              );
                            }
                            if (node.type === 'cutaway') {
                              return (
                                <div key={idx} className="bg-slate-900 text-white p-4 rounded-xl text-center my-3 space-y-1">
                                  <span className="text-[10px] font-mono text-red-400 uppercase tracking-widest block">[ BREAKING NEWS ]</span>
                                  <p className="text-xs font-serif italic text-slate-200">"{node.text}"</p>
                                </div>
                              );
                            }
                            return null;
                          })}
                        </div>
                      )}

                      {currentScene.interface === 'feed' && (
                        <div className="space-y-3">
                          <div className="flex items-center justify-between bg-white p-2 rounded-lg border border-slate-200 text-[11px] shadow-xs">
                            <span className="text-slate-600 font-medium">Public Reactions</span>
                            <button
                              onClick={() => setReduceBlameComments(!reduceBlameComments)}
                              className="text-dp-blue font-semibold hover:underline flex items-center space-x-1"
                            >
                              {reduceBlameComments ? <EyeOff className="w-3.5 h-3.5" /> : <Eye className="w-3.5 h-3.5" />}
                              <span>{reduceBlameComments ? 'Show All Comments' : 'Filter Victim Blaming'}</span>
                            </button>
                          </div>

                          {currentScene.nodes.map((node, idx) => {
                            if (node.type === 'post') {
                              return (
                                <div key={idx} className="bg-white border border-slate-200 rounded-xl p-3.5 space-y-2 shadow-xs">
                                  <div className="flex items-center space-x-2">
                                    <div className="w-7 h-7 rounded-full bg-dp-navy flex items-center justify-center text-white font-bold text-xs">
                                      N
                                    </div>
                                    <div>
                                      <h5 className="text-xs font-bold text-slate-900">{node.author}</h5>
                                      <span className="text-[9px] text-slate-500">Verified Channel • 1h ago</span>
                                    </div>
                                  </div>
                                  <p className="text-xs text-slate-800 leading-relaxed">{node.text}</p>
                                  <div className="flex items-center space-x-4 text-[11px] text-slate-500 pt-1 border-t border-slate-100">
                                    <span className="flex items-center space-x-1">
                                      <Heart className="w-3.5 h-3.5 text-dp-crimson" />
                                      <span>{node.likes.toLocaleString()}</span>
                                    </span>
                                    <span className="flex items-center space-x-1">
                                      <MessageSquare className="w-3.5 h-3.5" />
                                      <span>Comments</span>
                                    </span>
                                  </div>
                                </div>
                              );
                            }

                            if (node.type === 'comment') {
                              if (reduceBlameComments && node.stance === 'blame') return null;
                              return (
                                <div key={idx} className={`p-2.5 rounded-lg border text-xs space-y-1 bg-white ${
                                  node.stance === 'blame' 
                                    ? 'border-red-200 bg-red-50/50 text-red-900' 
                                    : node.stance === 'counter'
                                    ? 'border-blue-200 bg-blue-50/50 text-blue-900'
                                    : 'border-slate-200 text-slate-800'
                                }`}>
                                  <div className="flex items-center justify-between text-[10px]">
                                    <span className="font-bold text-slate-500">Anonymous User</span>
                                    <span className={`px-1.5 py-0.5 rounded text-[9px] font-semibold ${
                                      node.stance === 'blame' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-700'
                                    }`}>
                                      {node.stance}
                                    </span>
                                  </div>
                                  <p className="leading-snug">{node.text}</p>
                                </div>
                              );
                            }
                            return null;
                          })}
                        </div>
                      )}

                    </div>

                    <div className="bg-[#F0F0F0] px-3 py-2.5 flex items-center justify-between border-t border-slate-300 z-10">
                      <button
                        onClick={handleNextNode}
                        className="w-full py-2.5 rounded-full bg-[#075E54] hover:bg-[#064e46] text-white text-xs font-bold shadow transition flex items-center justify-center space-x-1.5"
                      >
                        <span>
                          {currentNodeIdx < currentScene.nodes.length - 1 
                            ? 'Simulate Incoming Message / Chime' 
                            : currentBeatIdx < activeScenes.length - 1 
                            ? 'Proceed to Next Chapter' 
                            : 'View Case Summary'}
                        </span>
                        <ChevronRight className="w-3.5 h-3.5" />
                      </button>
                    </div>

                  </div>
                </div>

              </div>
            )}

            {/* ==================== CASE FINALE ==================== */}
            {currentRoute === 'finale' && (
              <div className="max-w-xl mx-auto bg-white border border-dp-border rounded-3xl p-6 sm:p-10 shadow-xl text-center space-y-6 my-4">
                <div className="inline-flex p-4 rounded-2xl bg-dp-lightBlue text-dp-blue">
                  <Scale className="w-10 h-10" />
                </div>

                <div className="space-y-3">
                  <h2 className="text-2xl font-heading font-extrabold text-dp-navy">
                    {selectedCharacter.name} is not the only one.
                  </h2>
                  <p className="text-xs sm:text-sm text-dp-mutedText leading-relaxed">
                    She was killed not because of a private mistake, but because systemic doors closed on her at every turn. Gender-based violence in Nigeria is fueled by systemic silence and institutional non-response.
                  </p>
                </div>

                <div className="bg-slate-50 border border-dp-border rounded-2xl p-5 text-left space-y-2.5 text-xs sm:text-sm">
                  <span className="text-dp-navy font-bold uppercase tracking-wider block text-[10px]">
                    Systemic Audit for {selectedCharacter.name}
                  </span>
                  <div className="flex justify-between text-dp-darkText">
                    <span>Total Accumulated Pressure:</span>
                    <strong className="text-dp-crimson font-mono">{calculateTotalPressure()} points</strong>
                  </div>
                  <div className="flex justify-between text-dp-darkText">
                    <span>Support Doors Attempted:</span>
                    <strong className="text-dp-navy">{doorsLog.length} doors</strong>
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  <button
                    onClick={() => setCurrentRoute('data-story')}
                    className="w-full py-4 rounded-xl bg-dp-navy hover:bg-dp-blue text-white font-heading font-bold text-xs sm:text-sm shadow transition flex items-center justify-center space-x-2"
                  >
                    <FileText className="w-4 h-4" />
                    <span>Read Femicide Data Story & Report</span>
                  </button>

                  <button
                    onClick={() => setCurrentRoute('choose')}
                    className="w-full py-3.5 rounded-xl bg-dp-lightBlue text-dp-blue font-semibold text-xs sm:text-sm hover:bg-blue-100 transition flex items-center justify-center space-x-2"
                  >
                    <RotateCcw className="w-4 h-4" />
                    <span>Play as Another Character</span>
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* ==================== DISCLAIMER POPUP MODAL ==================== */}
          {disclaimerOpen && (
            <div className="fixed inset-0 z-50 bg-dp-navy/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-white border border-dp-border rounded-3xl p-6 sm:p-8 space-y-5 shadow-2xl relative">
                <button
                  onClick={() => setDisclaimerOpen(false)}
                  className="absolute top-4 right-4 p-2 rounded-full hover:bg-slate-100 text-dp-mutedText hover:text-dp-navy"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="flex items-center space-x-3 text-dp-navy">
                  <AlertTriangle className="w-7 h-7 text-dp-crimson" />
                  <div>
                    <h3 className="text-xl font-heading font-bold text-dp-navy">Project Disclaimer</h3>
                    <p className="text-xs text-dp-mutedText">Dataphyte Femicide Reporting Series</p>
                  </div>
                </div>

                <div className="bg-slate-50 border border-dp-border rounded-2xl p-4 text-xs sm:text-sm text-dp-darkText space-y-3 leading-relaxed">
                  <p>
                    <strong>Sensitive Content Notice:</strong> This interactive simulation models real patterns of intimate partner control, stalking, and institutional non-response in Nigeria.
                  </p>
                  <ul className="list-disc list-inside space-y-1 text-dp-mutedText text-xs">
                    <li><strong>No physical violence or graphic injury is depicted.</strong> Scenarios cut away prior to any harm.</li>
                    <li>Personas are composite profiles built from legal research, public records, and advocacy data.</li>
                    <li>Designed strictly for advocacy, policy awareness, and empirical research.</li>
                  </ul>
                </div>

                <button
                  onClick={() => {
                    setDisclaimerOpen(false);
                    setCurrentRoute('choose');
                  }}
                  className="w-full py-3.5 rounded-xl bg-dp-navy hover:bg-dp-blue text-white font-heading font-bold text-xs sm:text-sm transition shadow"
                >
                  I Understand — Enter WhatsApp Simulation
                </button>
              </div>
            </div>
          )}

          {/* ==================== CRISIS HELPLINES MODAL ==================== */}
          {supportModalOpen && (
            <div className="fixed inset-0 z-50 bg-dp-navy/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-white border border-dp-border rounded-2xl p-6 space-y-5 max-h-[85vh] overflow-y-auto shadow-2xl relative">
                <button
                  onClick={() => setSupportModalOpen(false)}
                  className="absolute top-4 right-4 p-2 rounded-full hover:bg-slate-100 text-dp-mutedText hover:text-dp-navy"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="space-y-1">
                  <div className="flex items-center space-x-2 text-dp-navy font-heading font-bold text-lg">
                    <Shield className="w-5 h-5 text-dp-blue" />
                    <span>Verified Crisis Support (Nigeria)</span>
                  </div>
                  <p className="text-xs text-dp-mutedText">
                    If you or someone you know requires emergency assistance or legal counsel:
                  </p>
                </div>

                <div className="space-y-3">
                  {VERIFIED_RESOURCES.map((res, i) => (
                    <div key={i} className="bg-slate-50 border border-dp-border rounded-2xl p-4 space-y-2 text-xs">
                      <div className="flex items-center justify-between">
                        <h5 className="font-bold text-dp-navy">{res.name}</h5>
                        <span className="text-[10px] text-dp-mutedText font-mono">{res.location}</span>
                      </div>
                      <p className="text-dp-darkText">{res.services}</p>
                      <div className="flex items-center justify-between pt-2 border-t border-dp-border text-[11px]">
                        <a href={`tel:${res.phone}`} className="text-dp-blue font-mono font-bold flex items-center space-x-1">
                          <PhoneCall className="w-3.5 h-3.5" />
                          <span>{res.phone}</span>
                        </a>
                        <span className="text-dp-mutedText">{res.web}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="w-full border-t border-dp-border py-6 text-center text-xs text-dp-mutedText bg-white mt-8 space-y-1">
            <p className="font-heading font-bold text-dp-navy">Dataphyte Media & Research Initiative</p>
            <p>Data-driven reporting for governance, accountability, and public safety.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
