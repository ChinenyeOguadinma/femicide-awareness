      const [completedCharacters, setCompletedCharacters] = useState([]);

        setSelectedCharacter(char);
        setCurrentBeatIdx(0);
        setCurrentNodeIdx(0);
        setPressure(char.initialPressure);
        setDoorsLog([]);
        setCurrentRoute('play');
      };

      const calculateTotalPressure = () => {
        return Object.values(pressure).reduce((acc, curr) => acc + curr, 0);
      };

      const addPressure = (pressureMap) => {
        if (!pressureMap) return;
        setPressure(prev => {
          const next = { ...prev };
          Object.keys(pressureMap).forEach(key => {
            next[key] = (next[key] || 0) + pressureMap[key];
          });
          return next;
        });
      };

      const handleDoorClick = (door) => {
        if (doorsLog.some(d => d.id === door.id)) return;
        setDoorsLog(prev => [...prev, door]);
        addPressure({ [door.pressure]: 15 });
      };

      const activeScenes = SCENES_DATA[selectedCharacter.id] || SCENES_DATA['chioma'];
      const currentScene = activeScenes[currentBeatIdx] || activeScenes[0];

      const handleNextNode = () => {
        if (currentNodeIdx < currentScene.nodes.length - 1) {
          setCurrentNodeIdx(prev => prev + 1);
        } else {
          if (currentBeatIdx < activeScenes.length - 1) {
            setCurrentBeatIdx(prev => prev + 1);
            setCurrentNodeIdx(0);
          } else {
            if (!completedCharacters.includes(selectedCharacter.id)) {
              setCompletedCharacters(prev => [...prev, selectedCharacter.id]);
            }
            setCurrentRoute('finale');
          }
        }
      };

                  currentRoute === 'home' ? 'bg-dp-lightBlue text-dp-blue font-bold' : 'text-dp-mutedText hover:text-dp-navy'

                <HomeIcon className="w-4 h-4" />
                <span className="hidden sm:inline">Home</span>
              </button>

              <button
                onClick={() => setCurrentRoute('choose')}
                className={`px-3 py-2 rounded-lg transition ${
                  currentRoute === 'choose' || currentRoute === 'play' ? 'bg-dp-lightBlue text-dp-blue font-bold' : 'text-dp-mutedText hover:text-dp-navy'

              <button

                        <Shield className="w-3.5 h-3.5 text-dp-blue" />
                        <span>Dataphyte Investigative Narrative</span>
                      </div>

                      <h1 className="text-3xl sm:text-5xl font-heading font-black leading-tight tracking-tight text-white">
                        Femicide in Nigeria: <span className="text-blue-300">The Silent Epidemic</span>
                      </h1>

                      <p className="text-sm sm:text-base text-slate-200 leading-relaxed font-light">

                      <div

                        className={`group rounded-2xl border p-6 cursor-pointer transition-all hover:border-dp-blue hover:shadow-md bg-white flex flex-col justify-between ${
                          isDone ? 'border-emerald-500/50 bg-emerald-50/20' : 'border-dp-border'
                        }`}
                      >
                        <div className="space-y-4">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center space-x-3">
                              <div className={`w-12 h-12 rounded-full ${char.avatarColor} flex items-center justify-center font-heading font-bold text-base shadow-sm`}>
                                {char.name[0]}

                              <div>

                                  {char.name}, {char.age}

                              </div>

                            {isDone && (

                                <CheckCheck className="w-3 h-3" />

                              </span>
                            )}
                          </div>

                          <div className="flex items-center space-x-1 text-xs text-dp-blue font-semibold">
                            <MapPin className="w-3.5 h-3.5" />
                            <span>{char.location}</span>
                          </div>

                          <p className="text-xs text-dp-darkText leading-relaxed">
                            {char.blurb}
                          </p>
                        </div>

                        <div className="mt-6 pt-3 border-t border-dp-border flex items-center justify-between text-xs font-bold text-dp-navy group-hover:text-dp-blue">
                          <span>Begin Storyline</span>
                          <ChevronRight className="w-4 h-4 transform group-hover:translate-x-1 transition-transform" />
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ==================== IMMERSIVE STORY ENGINE ==================== */}
            {currentRoute === 'play' && (
              <div className="flex flex-col items-center space-y-6 py-2">
                
                {/* Story Navigation Control Bar */}
                <div className="w-full max-w-2xl bg-white border border-dp-border rounded-xl p-3.5 flex items-center justify-between shadow-sm">
                  <div className="flex items-center space-x-3">
                    <button 
                      onClick={() => setSoundActive(!soundActive)}
                      className="p-2 rounded-lg bg-dp-lightBlue text-dp-blue hover:bg-dp-blue hover:text-white transition"
                      title="Toggle Ambient Audio Cues"
                    >
                      {soundActive ? <Volume2 className="w-4 h-4" /> : <VolumeX className="w-4 h-4" />}
                    </button>
                    <div>
                      <span className="text-xs font-bold text-dp-navy block">Atmospheric Cues: Active</span>
                      <span className="text-[10px] text-dp-mutedText italic">{currentScene.ambientAudio || 'Ambient soundscape enabled'}</span>
                    </div>
                  </div>

                  <div className="flex items-center space-x-3">
                    <div className="text-right">
                      <span className="text-[10px] font-bold text-dp-mutedText block uppercase tracking-wider">Systemic Pressure</span>
                      <span className="text-xs font-mono font-bold text-dp-navy">{calculateTotalPressure()} points</span>
                    </div>
                    <div className="w-24 bg-slate-200 h-2 rounded-full overflow-hidden">
                      <div 
                        className="bg-dp-navy h-full transition-all duration-300" 
                        style={{ width: `${Math.min(100, (calculateTotalPressure() / 80) * 100)}%` }}

                    {currentScene.interface === 'police' && (
                      <div className="space-y-3 pt-2">
                        {currentScene.nodes.slice(0, currentNodeIdx + 1).map((node, idx) => {
                          if (node.type === 'dialogue') {
                            const isOfficer = node.speaker === 'Desk Officer';
                            return (
                              <div key={idx} className={`p-4 rounded-xl border text-xs sm:text-sm leading-relaxed ${
                                isOfficer 
                                  ? 'bg-slate-50 border-dp-border text-dp-darkText' 
                                  : 'bg-white border-dp-blue/40 text-dp-navy font-medium'
                              }`}>
                                <span className="font-bold block text-[10px] text-dp-blue uppercase tracking-wider mb-1">
                                  {node.speaker}
                                </span>
                                <p>"{node.text}"</p>
                              </div>
                            );
                          }
                          if (node.type === 'cutaway') {
                            return (
                              <div key={idx} className="bg-dp-navy text-white rounded-2xl p-8 text-center my-6 space-y-3 shadow-lg">
                                <span className="text-xs font-mono text-blue-300 tracking-widest uppercase block">[ CUT AWAY ]</span>
                                <p className="text-base font-serif italic leading-relaxed text-slate-100">
                                  "{node.text}"
                                </p>
                              </div>
                            );
                          }
                          return null;
                        })}
                      </div>
                    )}

                  </div>

                  {/* Next Step Action Button */}
                  <div className="pt-6 border-t border-dp-border mt-6">
                    <button
                      onClick={handleNextNode}
                      className="w-full py-4 rounded-xl bg-dp-navy hover:bg-dp-blue text-white text-xs sm:text-sm font-heading font-bold shadow-md transition flex items-center justify-center space-x-2"
                    >
                      <span>
                        {currentNodeIdx < currentScene.nodes.length - 1 
                          ? 'Continue Narrative' 
                          : currentBeatIdx < activeScenes.length - 1 
                          ? 'Proceed to Next Chapter' 
                          : 'View Case Audit Summary'}
                      </span>
                      <ChevronRight className="w-4 h-4" />
                    </button>
                  </div>

                </div>
              </div>
            )}

            {/* ==================== CASE FINALE ==================== */}
            {currentRoute === 'finale' && (
              <div className="max-w-xl mx-auto bg-white border border-dp-border rounded-3xl p-6 sm:p-10 shadow-xl text-center space-y-6 my-4">
                <div className="inline-flex p-4 rounded-2xl bg-dp-lightBlue text-dp-blue">
                  <Shield className="w-10 h-10" />
                </div>

                <div className="space-y-2">
                  <h2 className="text-2xl font-heading font-extrabold text-dp-navy">
                    {selectedCharacter.name}'s Narrative Audit
                  </h2>
                  <p className="text-xs sm:text-sm text-dp-mutedText leading-relaxed">
                    This narrative highlights how informal mediation and non-intervention limit options for women long before crisis occurs.
                  </p>
                </div>

                <div className="bg-slate-50 border border-dp-border rounded-2xl p-5 text-left space-y-2.5 text-xs sm:text-sm">
                  <span className="text-dp-navy font-bold uppercase tracking-wider block text-[10px]">
                    Systemic Metrics: {selectedCharacter.name}
                  </span>
                  <div className="flex justify-between text-dp-darkText">
                    <span>Systemic Pressure Level:</span>
                    <strong className="text-dp-navy font-mono">{calculateTotalPressure()} points</strong>
                  </div>
                  <div className="flex justify-between text-dp-darkText">
                    <span>Support Entities Contacted:</span>
                    <strong className="text-dp-navy">{doorsLog.length} doors</strong>
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  <button
                    onClick={() => setCurrentRoute('data-story')}
                    className="w-full py-4 rounded-xl bg-dp-navy hover:bg-dp-blue text-white font-heading font-bold text-xs sm:text-sm shadow transition flex items-center justify-center space-x-2"
                  >
                    <BarChart className="w-4 h-4" />
                    <span>View Dataphyte Empirical Data</span>
                  </button>

                  <button
                    onClick={() => setCurrentRoute('choose')}
                    className="w-full py-3.5 rounded-xl bg-white border border-dp-border text-dp-navy font-semibold text-xs sm:text-sm hover:bg-slate-50 transition"
                  >
                    Select Another Narrative
                  </button>
                </div>
              </div>
            )}

            {/* ==================== DATA & POLICY BRIEF ==================== */}
            {currentRoute === 'data-story' && (
              <div className="space-y-8 py-4">
                <div className="text-center space-y-2 border-b border-dp-border pb-6">
                  <span className="text-xs font-mono text-dp-blue tracking-widest uppercase font-bold">
                    Dataphyte Empirical Findings
                  </span>
                  <h2 className="text-3xl font-heading font-extrabold text-dp-navy">
                    Femicide in Nigeria: Key Indicators
                  </h2>
                  <p className="text-xs sm:text-sm text-dp-mutedText max-w-xl mx-auto">
                    A data-driven breakdown examining VAPP Act state implementation, police reporting rates, and key findings.
                  </p>
                </div>

                {/* 3 Metric Cards */}
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                  <div className="bg-white border border-dp-border rounded-2xl p-6 text-center space-y-1 shadow-sm">
                    <span className="text-4xl font-extrabold text-dp-navy font-mono">72%+</span>
                    <p className="text-xs font-bold text-dp-darkText pt-2">Perpetrators Known to Victim</p>
                    <span className="text-[11px] text-dp-mutedText block">Intimate partners or family acquaintances</span>
                  </div>

                  <div className="bg-white border border-dp-border rounded-2xl p-6 text-center space-y-1 shadow-sm">
                    <span className="text-4xl font-extrabold text-dp-blue font-mono">35 / 36</span>
                    <p className="text-xs font-bold text-dp-darkText pt-2">States Adopted VAPP Act</p>
                    <span className="text-[11px] text-dp-mutedText block">Implementation desks remain severely unfunded</span>
                  </div>

                  <div className="bg-white border border-dp-border rounded-2xl p-6 text-center space-y-1 shadow-sm">
                    <span className="text-4xl font-extrabold text-slate-700 font-mono">&lt; 8%</span>
                    <p className="text-xs font-bold text-dp-darkText pt-2">Formal Police Prosecutions</p>
                    <span className="text-[11px] text-dp-mutedText block">Most reports turned away at desk level</span>
                  </div>
                </div>

                <div className="bg-white border border-dp-border rounded-2xl p-6 space-y-4 shadow-sm">
                  <h3 className="text-lg font-heading font-bold text-dp-navy flex items-center space-x-2">
                    <Shield className="w-5 h-5 text-dp-blue" />
                    <span>Policy Recommendations</span>
                  </h3>
                  <ul className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs sm:text-sm text-dp-darkText">
                    <li className="bg-slate-50 p-4 rounded-xl border border-dp-border">
                      <strong className="text-dp-navy block mb-1 font-heading">Police Desk Protocol</strong>
                      Mandate specialized gender desks across local divisions trained to recognize non-physical coercion and digital stalking.
                    </li>
                    <li className="bg-slate-50 p-4 rounded-xl border border-dp-border">
                      <strong className="text-dp-navy block mb-1 font-heading">Digital Stalking Enforcement</strong>
                      Update cybercrime enforcement protocols to prioritize intimate partner surveillance before physical harm occurs.
                    </li>
                  </ul>
                </div>

                <div className="text-center pt-4">
                  <button
                    onClick={() => setSupportModalOpen(true)}
                    className="px-6 py-3.5 rounded-xl bg-dp-navy hover:bg-dp-blue text-white font-heading font-bold text-xs sm:text-sm shadow transition"
                  >
                    Access Emergency Helpline Directory
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* ==================== DISCLAIMER POPUP MODAL ==================== */}
          {disclaimerOpen && (
            <div className="fixed inset-0 z-50 bg-dp-navy/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-white border border-dp-border rounded-3xl p-6 sm:p-8 space-y-5 shadow-2xl relative">
                <button
                  onClick={() => setDisclaimerOpen(false)}
                  className="absolute top-4 right-4 p-2 rounded-full hover:bg-slate-100 text-dp-mutedText hover:text-dp-navy"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="flex items-center space-x-3 text-dp-navy">
                  <AlertTriangle className="w-7 h-7 text-dp-crimson" />
                  <div>
                    <h3 className="text-xl font-heading font-bold text-dp-navy">Project Disclaimer</h3>
                    <p className="text-xs text-dp-mutedText">Dataphyte Femicide Reporting Series</p>
                  </div>
                </div>

                <div className="bg-slate-50 border border-dp-border rounded-2xl p-4 text-xs sm:text-sm text-dp-darkText space-y-3 leading-relaxed">
                  <p>
                    <strong>Content Notice:</strong> This interactive journalistic tool models real patterns of intimate partner control, stalking, and institutional non-response in Nigeria.
                  </p>
                  <ul className="list-disc list-inside space-y-1 text-dp-mutedText text-xs">
                    <li><strong>No physical violence or graphic injury is depicted.</strong> Scenarios cut away prior to any harm.</li>
                    <li>Personas are composite profiles built from legal research, public records, and advocacy data.</li>
                    <li>Designed strictly for advocacy, policy awareness, and empirical research.</li>
                  </ul>
                </div>

                <button
                  onClick={() => setDisclaimerOpen(false)}
                  className="w-full py-3.5 rounded-xl bg-dp-navy hover:bg-dp-blue text-white font-heading font-bold text-xs sm:text-sm transition shadow"
                >
                  Close & Continue
                </button>
              </div>
            </div>
          )}

          {/* ==================== CRISIS HELPLINES MODAL ==================== */}
          {supportModalOpen && (
            <div className="fixed inset-0 z-50 bg-dp-navy/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-white border border-dp-border rounded-3xl p-6 space-y-5 max-h-[85vh] overflow-y-auto shadow-2xl relative">
                <button
                  onClick={() => setSupportModalOpen(false)}
                  className="absolute top-4 right-4 p-2 rounded-full hover:bg-slate-100 text-dp-mutedText hover:text-dp-navy"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="space-y-1">
                  <div className="flex items-center space-x-2 text-dp-navy font-heading font-bold text-lg">
                    <Shield className="w-5 h-5 text-dp-blue" />
                    <span>Verified Crisis Support (Nigeria)</span>
                  </div>
                  <p className="text-xs text-dp-mutedText">
                    If you or someone you know requires emergency assistance or legal counsel:
                  </p>
                </div>

                <div className="space-y-3">
                  {VERIFIED_RESOURCES.map((res, i) => (
                    <div key={i} className="bg-slate-50 border border-dp-border rounded-2xl p-4 space-y-2 text-xs">
                      <div className="flex items-center justify-between">
                        <h5 className="font-bold text-dp-navy">{res.name}</h5>
                        <span className="text-[10px] text-dp-mutedText font-mono">{res.location}</span>
                      </div>
                      <p className="text-dp-darkText">{res.services}</p>
                      <div className="flex items-center justify-between pt-2 border-t border-dp-border text-[11px]">
                        <a href={`tel:${res.phone}`} className="text-dp-blue font-mono font-bold flex items-center space-x-1">
                          <PhoneCall className="w-3.5 h-3.5" />
                          <span>{res.phone}</span>
                        </a>
                        <span className="text-dp-mutedText">{res.web}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="w-full border-t border-dp-border py-6 text-center text-xs text-dp-mutedText bg-white mt-8 space-y-1">
            <p className="font-heading font-bold text-dp-navy">Dataphyte Media & Research Initiative</p>
            <p>Data-driven reporting for governance, accountability, and public safety.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
