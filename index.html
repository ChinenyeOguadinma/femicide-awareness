                        style={{ width: `${Math.min(100, (calculateTotalPressure() / 80) * 100)}%` }}
                      />
                    </div>
                    <span className="text-xs font-mono font-bold text-dp-crimson">
                      {calculateTotalPressure()} pt
                    </span>
                  </div>
                </div>

                {/* Device Frame */}
                <div className="w-full max-w-sm sm:max-w-md bg-dp-dark border border-dp-border rounded-[2.5rem] p-3 shadow-2xl relative overflow-hidden flex flex-col min-h-[580px] sm:min-h-[640px]">
                  
                  {/* Top Status */}
                  <div className="w-full px-4 pt-1 pb-2 flex items-center justify-between text-[11px] font-mono text-slate-400 border-b border-dp-border mb-2">
                    <span>09:41</span>
                    <div className="w-16 h-3 bg-dp-card rounded-full mx-auto border border-dp-border"></div>
                    <div className="flex items-center space-x-1.5">
                      <span>5G</span>
                      <div className="w-4 h-2 bg-slate-400 rounded-sm"></div>
                    </div>
                  </div>

                  {/* Scene Header */}
                  <div className="bg-dp-navy/90 rounded-xl p-2.5 mb-3 flex items-center justify-between border border-dp-border">
                    <div className="flex items-center space-x-2">
                      <div className={`w-8 h-8 rounded-full bg-gradient-to-br ${selectedCharacter.avatarColor} flex items-center justify-center text-white font-bold text-xs font-heading`}>
                        {selectedCharacter.name[0]}
                      </div>
                      <div>
                        <h4 className="text-xs font-bold text-slate-100">{currentScene.headerTitle || selectedCharacter.name}</h4>
                        <p className="text-[10px] text-dp-amber font-medium">{currentScene.beatTitle}</p>
                      </div>
                    </div>
                    <span className="text-[10px] bg-dp-card text-slate-300 px-2 py-0.5 rounded-full font-mono border border-dp-border">
                      Beat {currentBeatIdx + 1}/6
                    </span>
                  </div>

                  {/* Interfaces */}
                  <div className="flex-1 overflow-y-auto space-y-3 px-1 custom-scrollbar">
                    
                    {currentScene.interface === 'phone' && (
                      <div className="space-y-3">
                        {currentScene.nodes.slice(0, currentNodeIdx + 1).map((node, idx) => {
                          if (node.type === 'narration') {
                            return (
                              <div key={idx} className="bg-dp-card/60 border border-dp-border rounded-xl p-3 text-center my-2">
                                <p className="text-xs text-slate-300 italic leading-relaxed">{node.text}</p>
                              </div>
                            );
                          }
                          if (node.type === 'message') {
                            const isHer = node.from === 'her';
                            return (
                              <div key={idx} className={`flex flex-col ${isHer ? 'items-end' : 'items-start'} space-y-1`}>
                                {!isHer && <span className="text-[10px] text-slate-400 px-1 font-semibold">{node.from}</span>}
                                <div className={`max-w-[82%] rounded-2xl px-3.5 py-2.5 text-xs shadow-md ${
                                  isHer 
                                    ? 'bg-dp-blue border border-blue-600/40 text-white rounded-br-none' 
                                    : 'bg-dp-card border border-dp-border text-slate-200 rounded-bl-none'
                                }`}>
                                  <p className="leading-relaxed">{node.text}</p>
                                  <div className="flex items-center justify-end space-x-1 text-[9px] text-slate-300 mt-1">
                                    <span>09:42</span>
                                    {isHer && <CheckCheck className="w-3 h-3 text-dp-amber" />}
                                  </div>
                                </div>
                              </div>
                            );
                          }
                          if (node.type === 'choice') {
                            return (
                              <div key={idx} className="bg-dp-card border border-dp-amber/40 rounded-2xl p-3 my-3 space-y-2">
                                <span className="text-[10px] font-bold text-dp-amber tracking-wider uppercase block">
                                  Select Response
                                </span>
                                <div className="space-y-2">
                                  {node.options.map((opt, oIdx) => {
                                    const isGreyedOut = opt.disabledAbove && calculateTotalPressure() >= opt.disabledAbove;
                                    return (
                                      <button
                                        key={oIdx}
                                        disabled={isGreyedOut}
                                        onClick={() => {
                                          addPressure(opt.pressure);
                                          handleNextNode();
                                        }}
                                        className={`w-full text-left p-2.5 rounded-xl text-xs transition-all ${
                                          isGreyedOut 
                                            ? 'bg-dp-dark text-slate-600 border border-slate-800 cursor-not-allowed line-through' 
                                            : 'bg-dp-amber/10 border border-dp-amber/30 text-amber-200 hover:bg-dp-amber/20 active:scale-98'
                                        }`}
                                      >
                                        {opt.label}
                                        {isGreyedOut && <span className="block text-[9px] text-dp-crimson font-semibold no-underline">Choice blocked due to systemic isolation</span>}
                                      </button>
                                    );
                                  })}
                                </div>
                              </div>
                            );
                          }
                          return null;
                        })}
                      </div>
                    )}

                    {currentScene.interface === 'doors' && (
                      <div className="space-y-3">
                        <div className="bg-dp-card border border-dp-border rounded-xl p-3 text-xs text-slate-300">
                          <p className="font-semibold text-dp-amber mb-1">Systemic Refusal Map</p>
                          <p>Select doors to reach out to. Observe how support networks consistently shift responsibility back onto the woman.</p>
                        </div>

                        <div className="grid grid-cols-1 gap-2.5">
                          {currentScene.nodes.filter(n => n.type === 'door').map((door) => {
                            const isLogged = doorsLog.some(d => d.id === door.id);
                            return (
                              <div
                                key={door.id}
                                onClick={() => handleDoorClick(door)}
                                className={`p-3 rounded-xl border transition-all cursor-pointer ${
                                  isLogged 
                                    ? 'bg-dp-card/40 border-dp-crimson/40 opacity-75' 
                                    : 'bg-dp-card border-dp-border hover:border-dp-amber'
                                }`}
                              >
                                <div className="flex items-center justify-between mb-1">
                                  <span className="text-xs font-bold text-slate-200">{door.label}</span>
                                  <span className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded ${
                                    isLogged ? 'bg-dp-crimson/20 text-dp-crimson border border-dp-crimson/40' : 'bg-dp-dark text-slate-400'
                                  }`}>
                                    {isLogged ? door.response : 'Unopened'}
                                  </span>
                                </div>
                                {isLogged && (
                                  <p className="text-xs text-slate-300 italic mt-2 border-t border-dp-border pt-2">
                                    "{door.text}"
                                  </p>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {currentScene.interface === 'police' && (
                      <div className="space-y-3">
                        {currentScene.nodes.slice(0, currentNodeIdx + 1).map((node, idx) => {
                          if (node.type === 'dialogue') {
                            const isOfficer = node.speaker === 'Desk Officer' || node.speaker === 'Officer';
                            return (
                              <div key={idx} className={`p-3 rounded-xl border text-xs leading-relaxed ${
                                isOfficer 
                                  ? 'bg-dp-card border-dp-border text-slate-200' 
                                  : 'bg-dp-navy border border-dp-blue text-slate-100'
                              }`}>
                                <span className="font-bold block text-[10px] text-dp-amber uppercase tracking-wider mb-1">
                                  {node.speaker}
                                </span>
                                <p>"{node.text}"</p>
                              </div>
                            );
                          }
                          if (node.type === 'cutaway') {
                            return (
                              <div key={idx} className="bg-black border border-dp-border rounded-2xl p-6 text-center my-4 space-y-3">
                                <span className="text-xs font-mono text-dp-crimson tracking-widest uppercase block">[ CUT AWAY ]</span>
                                <p className="text-sm text-slate-200 font-serif italic leading-relaxed">
                                  "{node.text}"
                                </p>
                              </div>
                            );
                          }
                          if (node.type === 'narration') {
                            return (
                              <div key={idx} className="text-center p-2 text-xs text-slate-400 italic">
                                {node.text}
                              </div>
                            );
                          }
                          return null;
                        })}
                      </div>
                    )}

                    {currentScene.interface === 'feed' && (
                      <div className="space-y-3">
                        <div className="flex items-center justify-between bg-dp-card p-2 rounded-lg border border-dp-border text-[11px]">
                          <span className="text-slate-400 font-medium">Public Reactions</span>
                          <button
                            onClick={() => setReduceBlameComments(!reduceBlameComments)}
                            className="text-dp-amber font-semibold hover:underline flex items-center space-x-1"
                          >
                            {reduceBlameComments ? <EyeOff className="w-3.5 h-3.5" /> : <Eye className="w-3.5 h-3.5" />}
                            <span>{reduceBlameComments ? 'Show All' : 'Filter Victim Blaming'}</span>
                          </button>
                        </div>

                        {currentScene.nodes.map((node, idx) => {
                          if (node.type === 'post') {
                            return (
                              <div key={idx} className="bg-dp-card border border-dp-border rounded-xl p-3.5 space-y-2">
                                <div className="flex items-center space-x-2">
                                  <div className="w-7 h-7 rounded-full bg-dp-amber text-dp-dark flex items-center justify-center font-bold text-xs font-heading">
                                    D
                                  </div>
                                  <div>
                                    <h5 className="text-xs font-bold text-slate-100">{node.author}</h5>
                                    <span className="text-[9px] text-slate-400">Verified Channel • 1h ago</span>
                                  </div>
                                </div>
                                <p className="text-xs text-slate-200 leading-relaxed">{node.text}</p>
                              </div>
                            );
                          }

                          if (node.type === 'comment') {
                            if (reduceBlameComments && node.stance === 'blame') return null;
                            return (
                              <div key={idx} className={`p-2.5 rounded-lg border text-xs space-y-1 ${
                                node.stance === 'blame' 
                                  ? 'bg-dp-crimson/10 border-dp-crimson/30 text-rose-200' 
                                  : 'bg-dp-card border-dp-border text-slate-300'
                              }`}>
                                <p className="leading-snug">{node.text}</p>
                              </div>
                            );
                          }
                          return null;
                        })}
                      </div>
                    )}

                    <div ref={chatBottomRef} />
                  </div>

                  {/* Next Step Control */}
                  <div className="pt-3 border-t border-dp-border mt-2">
                    <button
                      onClick={handleNextNode}
                      className="w-full py-3 rounded-xl bg-dp-amber hover:bg-dp-amberDark text-dp-dark text-xs font-heading font-bold tracking-wide shadow-md transition-all flex items-center justify-center space-x-1.5"
                    >
                      <span>
                        {currentNodeIdx < currentScene.nodes.length - 1 
                          ? 'Continue Reading' 
                          : currentBeatIdx < activeScenes.length - 1 
                          ? 'Proceed to Next Beat' 
                          : 'View Case Finale'}
                      </span>
                      <ChevronRight className="w-4 h-4" />
                    </button>
                  </div>

                </div>
              </div>
            )}

            {/* ==================== PAGE 5: FINALE ==================== */}
            {currentRoute === 'finale' && (
              <div className="w-full max-w-lg bg-dp-card border border-dp-border rounded-3xl p-6 sm:p-8 shadow-2xl text-center space-y-6 my-auto">
                <div className="inline-flex p-3 rounded-2xl bg-dp-amber/10 border border-dp-amber/30 text-dp-amber">
                  <Scale className="w-10 h-10" />
                </div>

                <div className="space-y-3">
                  <h2 className="text-2xl font-heading font-bold text-white">
                    {selectedCharacter.name}'s Story is Not an Isolated Case.
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-md mx-auto">
                    She was killed not due to a single failure, but because institutional doors closed on her at every turn. Gender violence is sustained when systemic systems refuse early intervention.
                  </p>
                </div>

                <div className="bg-dp-dark border border-dp-border rounded-2xl p-4 text-left space-y-2 text-xs">
                  <span className="text-dp-amber font-bold uppercase tracking-wider block text-[10px]">
                    Systemic Summary for {selectedCharacter.name}
                  </span>
                  <div className="flex justify-between text-slate-300">
                    <span>Total Systemic Pressure:</span>
                    <strong className="text-dp-crimson font-mono">{calculateTotalPressure()} points</strong>
                  </div>
                  <div className="flex justify-between text-slate-300">
                    <span>Support Entities Attempted:</span>
                    <strong className="text-dp-amber">{doorsLog.length} doors</strong>
                  </div>
                </div>

                <div className="space-y-3 pt-2">
                  <button
                    onClick={() => setCurrentRoute('data-story')}
                    className="w-full py-3.5 rounded-xl bg-dp-amber hover:bg-dp-amberDark text-dp-dark font-heading font-bold text-xs sm:text-sm tracking-wide shadow-lg transition-all flex items-center justify-center space-x-2"
                  >
                    <BookOpen className="w-4 h-4" />
                    <span>View Dataphyte Research & Data</span>
                  </button>

                  <button
                    onClick={() => setCurrentRoute('choose')}
                    className="w-full py-3 rounded-xl bg-dp-navy hover:bg-dp-blue text-white font-semibold text-xs transition-all flex items-center justify-center space-x-2"
                  >
                    <RotateCcw className="w-4 h-4" />
                    <span>Select Another Case Narrative</span>
                  </button>
                </div>
              </div>
            )}

            {/* ==================== PAGE 6: DATA & POLICY ==================== */}
            {currentRoute === 'data-story' && (
              <div className="w-full space-y-8 py-6">
                <div className="text-center space-y-3 border-b border-dp-border pb-6">
                  <span className="text-xs font-mono text-dp-amber tracking-widest uppercase font-bold">
                    Dataphyte Research Brief
                  </span>
                  <h2 className="text-3xl font-heading font-black text-white">
                    Femicide in Nigeria: Data Findings
                  </h2>
                  <p className="text-xs sm:text-sm text-slate-300 max-w-xl mx-auto">
                    Data analysis on state adoption of the VAPP Act, reporting barriers, and law enforcement prosecution trends.
                  </p>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div className="bg-dp-card border border-dp-border rounded-2xl p-5 text-center space-y-1">
                    <span className="text-3xl font-extrabold text-dp-crimson font-mono">72%+</span>
                    <p className="text-xs text-slate-200 font-semibold">Perpetrators Known to Victim</p>
                    <span className="text-[10px] text-slate-400 block pt-1">Intimate partners or family members</span>
                  </div>
                  <div className="bg-dp-card border border-dp-border rounded-2xl p-5 text-center space-y-1">
                    <span className="text-3xl font-extrabold text-dp-amber font-mono">35 / 36</span>
                    <p className="text-xs text-slate-200 font-semibold">States Adopted VAPP Act</p>
                    <span className="text-[10px] text-slate-400 block pt-1">Implementation desks remain severely unfunded</span>
                  </div>
                  <div className="bg-dp-card border border-dp-border rounded-2xl p-5 text-center space-y-1">
                    <span className="text-3xl font-extrabold text-dp-lightBlue font-mono">&lt; 8%</span>
                    <p className="text-xs text-slate-200 font-semibold">Police Prosecution Rate</p>
                    <span className="text-[10px] text-slate-400 block pt-1">Most domestic reports turned away at desk level</span>
                  </div>
                </div>

                <div className="bg-dp-card border border-dp-border rounded-2xl p-6 space-y-4">
                  <h3 className="text-lg font-heading font-bold text-white flex items-center space-x-2">
                    <Shield className="w-5 h-5 text-dp-amber" />
                    <span>Key Policy Takeaways</span>
                  </h3>
                  <ul className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs text-slate-300">
                    <li className="bg-dp-dark p-4 rounded-xl border border-dp-border">
                      <strong className="text-dp-amber block mb-1">Police Desk Training Gap</strong>
                      Desk officers routinely treat non-physical threats and stalking as private domestic matters, leaving high-risk cases unchecked.
                    </li>
                    <li className="bg-dp-dark p-4 rounded-xl border border-dp-border">
                      <strong className="text-dp-amber block mb-1">Digital Cyberstalking Enforcement</strong>
                      Cybercrime law enforcement lacks active inter-agency protocols to handle WhatsApp and social media stalking prior to physical harm.
                    </li>
                  </ul>
                </div>

                <div className="text-center pt-4 border-t border-dp-border">
                  <button
                    onClick={() => setSupportModalOpen(true)}
                    className="px-6 py-3.5 rounded-xl bg-dp-amber text-dp-dark font-heading font-bold text-xs sm:text-sm shadow-xl hover:bg-dp-amberDark transition"
                  >
                    Access Emergency Helpline Directory
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* ==================== DISCLAIMER POPUP MODAL ==================== */}
          {disclaimerOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-dp-card border border-dp-border rounded-3xl p-6 sm:p-8 space-y-5 shadow-2xl relative">
                <button
                  onClick={() => setDisclaimerOpen(false)}
                  className="absolute top-4 right-4 p-2 rounded-full bg-dp-dark text-slate-400 hover:text-white"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="flex items-center space-x-3 text-dp-amber">
                  <AlertTriangle className="w-8 h-8" />
                  <div>
                    <h3 className="text-xl font-heading font-bold text-white">Project Disclaimer</h3>
                    <p className="text-xs text-slate-400">Dataphyte Femicide Awareness Series</p>
                  </div>
                </div>

                <div className="bg-dp-dark border border-dp-border rounded-2xl p-4 text-xs sm:text-sm text-slate-300 space-y-3 leading-relaxed">
                  <p>
                    <strong>Sensitive Content Notice:</strong> This interactive journalistic tool models real patterns of intimate partner control, stalking, and institutional failure in urban Nigeria.
                  </p>
                  <ul className="list-disc list-inside space-y-1 text-slate-400 text-xs">
                    <li><strong>No physical violence or graphic injury is depicted.</strong> Stories cut away prior to violence.</li>
                    <li>All story personas are fictionalized composite characters created from verified legal records and human rights documentation.</li>
                    <li>This experience is intended for research, advocacy, and educational policy awareness.</li>
                  </ul>
                </div>

                <button
                  onClick={() => setDisclaimerOpen(false)}
                  className="w-full py-3.5 rounded-xl bg-dp-amber hover:bg-dp-amberDark text-dp-dark font-heading font-bold text-xs sm:text-sm transition shadow-lg"
                >
                  Acknowledge & Close Disclaimer
                </button>
              </div>
            </div>
          )}

          {/* ==================== SUPPORT & HELPLINES MODAL ==================== */}
          {supportModalOpen && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-dp-card border border-dp-border rounded-3xl p-6 space-y-5 max-h-[85vh] overflow-y-auto shadow-2xl relative">
                <button
                  onClick={() => setSupportModalOpen(false)}
                  className="absolute top-4 right-4 p-2 rounded-full bg-dp-dark text-slate-400 hover:text-white"
                >
                  <X className="w-5 h-5" />
                </button>

                <div className="space-y-1">
                  <div className="flex items-center space-x-2 text-dp-crimson font-heading font-bold text-lg">
                    <Shield className="w-5 h-5" />
                    <span>Verified Crisis Directories (Nigeria)</span>
                  </div>
                  <p className="text-xs text-slate-400">
                    If you or someone you know requires legal, medical, or psychological support:
                  </p>
                </div>

                <div className="space-y-3">
                  {VERIFIED_RESOURCES.map((res, i) => (
                    <div key={i} className="bg-dp-dark border border-dp-border rounded-2xl p-4 space-y-2 text-xs">
                      <div className="flex items-center justify-between">
                        <h5 className="font-bold text-dp-amber">{res.name}</h5>
                        <span className="text-[10px] text-slate-400 font-mono">{res.location}</span>
                      </div>
                      <p className="text-slate-300">{res.services}</p>
                      <div className="flex items-center justify-between pt-2 border-t border-dp-border text-[11px]">
                        <a href={`tel:${res.phone}`} className="text-emerald-400 font-mono font-bold flex items-center space-x-1">
                          <PhoneCall className="w-3.5 h-3.5" />
                          <span>{res.phone}</span>
                        </a>
                        <span className="text-slate-400">{res.web}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="w-full border-t border-dp-border py-4 text-center text-[11px] text-slate-400 space-y-1">
            <p className="font-heading font-bold text-slate-300">Dataphyte Media & Research Initiative</p>
            <p>Data-driven reporting for governance, accountability, and safety.</p>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
